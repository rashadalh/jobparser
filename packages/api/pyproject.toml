[project]
name = "jdparser"
version = "1.0.0"
description = "Resume-driven job matcher API (FastAPI + LangGraph)"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langgraph==0.6.11",
    "langchain-core==0.3.86",
    "openai==2.44.0",
    "instructor==1.15.3",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "playwright==1.60.0",
    "trafilatura==2.0.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "pypdf==6.14.2",
    "python-docx==1.2.0",
    "fastapi==0.128.8",
    "uvicorn[standard]==0.39.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "respx==0.23.1",
    "mypy==1.18.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jdparser"]
# Prompts are .md, not .py — without this they are absent from an installed wheel and
# every LLM node raises FileNotFoundError at import.
artifacts = ["jdparser/llm/prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
